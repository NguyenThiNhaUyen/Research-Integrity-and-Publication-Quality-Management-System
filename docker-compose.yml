services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    container_name: ripqms-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: ripqms-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  grobid:
    image: grobid/grobid:0.9.0-crf
    container_name: ripqms-grobid
    platform: linux/amd64
    init: true
    ulimits:
      core: 0
    ports:
      - "8070:8070"

  nougat-service:
    build:
      context: ./Services/NougatService
      dockerfile: Dockerfile
    container_name: ripqms-nougat-service
    ports:
      - "8001:8001"
    environment:
      NOUGAT_TEMP_DIR: /app/temp
      NOUGAT_MODEL: 0.1.0-small
      NOUGAT_MAX_WORKERS: 1
      NOUGAT_BATCH_SIZE: 1
      NOUGAT_MAX_RETRY: 1
      NOUGAT_USE_CUDA: "false"
      NOUGAT_MAX_CONCURRENT_PAGES: 1
      NOUGAT_PAGE_TIMEOUT_SECONDS: 180
      PYTHONUNBUFFERED: 1
    volumes:
      - ./temp:/app/temp
    healthcheck:
      test: ["CMD", "python", "/app/check_nougat.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8001"]
