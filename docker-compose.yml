services:
  publication-api:
    build:
      context: .
      dockerfile: PublicQualitySystem/PublicationQualitySystem.Api/Dockerfile
    container_name: publication-quality-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=PublicationQualityDB;Username=postgres;Password=123456
    depends_on:
      - postgres

  postgres:
    image: postgres:18
    container_name: publication-quality-postgres
    restart: always
    environment:
      POSTGRES_DB: PublicationQualityDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5433:5432"
    volumes:
      - publication_pgdata:/var/lib/postgresql/data

volumes:
  publication_pgdata:
