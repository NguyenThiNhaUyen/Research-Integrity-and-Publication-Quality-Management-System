services:
  nougat-service:
    build:
      context: ./Services/NougatService
      dockerfile: Dockerfile
    container_name: ripqms-nougat-service
    ports:
      - "8001:8001"
    environment:
      NOUGAT_TEMP_DIR: /app/temp
      NOUGAT_MODEL: 0.1.0-small
      NOUGAT_MAX_WORKERS: 2
      NOUGAT_BATCH_SIZE: 2
      NOUGAT_MAX_RETRY: 3
    volumes:
      - ./temp:/app/temp
    healthcheck:
      test: ["CMD", "python", "/app/check_nougat.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8001"]
